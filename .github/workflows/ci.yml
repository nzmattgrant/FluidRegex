name: CI

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows also runs the net48 tests, which exercise the shipped netstandard2.0 build on .NET Framework.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore FluidRegex.slnx
      - run: dotnet build FluidRegex.slnx -c Release --no-restore
      - run: dotnet test FluidRegex.slnx -c Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  pack:
    name: Pack
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches <Version>
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(dotnet msbuild FluidRegex/FluidRegex.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in FluidRegex.csproj"
            exit 1
          fi

      # Packing also runs package validation.
      - run: dotnet pack FluidRegex/FluidRegex.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  publish:
    name: Publish to nuget.org
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # nuget.org Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: exchanges the workflow's OIDC token for a short-lived API key, so no long-lived secret
      # is stored. Needs a matching policy on nuget.org and the NUGET_USER secret (the nuget.org profile name).
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag $prerelease
